name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test EC2 SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: uptime

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user/sd11-final-sprint-be
          git fetch https://BradTheeStallion:${{ secrets.TOKEN }}@github.com/${{ github.repository }}.git master
          git reset --hard FETCH_HEAD
          
          echo "Starting application deployment at $(date)"
          sudo docker-compose down || true
          sudo docker-compose build --pull
          sudo docker-compose up -d
          
          sleep 10
          if sudo docker-compose ps | grep -q "Up"; then
            echo "✅ Deployment successful! Services are running."
          else
            echo "❌ Deployment may have failed. Check container logs."
            sudo docker-compose logs
            exit 1
          fi
